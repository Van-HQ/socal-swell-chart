# Hourly snapshot of the forecast and the real buoy readings, saved to the "data" branch (not main, so the site is not redeployed).
# GitHub often delays or skips scheduled runs, so this fires every 15 minutes and only saves if the current hour is not logged yet.
# One small file per run at data/log/YYYY-MM-DD/HH.json (UTC). Later we compare "what was forecast" with "what the buoys measured".
name: Hourly log
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths: ["tools/logger/**", ".github/workflows/log.yml"]
permissions:
  contents: write
concurrency:
  group: hourly-log
  cancel-in-progress: false
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: datarepo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take snapshot
        run: |
          H=$(date -u +%F/%H)
          if [ -f "datarepo/data/log/$H.json" ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "already logged $H"; else node tools/logger/log.mjs datarepo/data/log; fi
      - name: Save to data branch
        working-directory: datarepo
        run: |
          git config user.name "swell-logger"
          git config user.email "swell-logger@users.noreply.github.com"
          git add -A data/log
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "log $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push origin HEAD:data && exit 0; git pull --rebase origin data; done
          exit 1
