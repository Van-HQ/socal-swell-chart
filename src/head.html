<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SoCal Swell Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
<style>

/* Layout: the chart fills the left with a few floating controls; a quiet list panel sits on the right (stacks under on phones). */
:root{
  --bg:#f1ecdf; --panel:#fbf9f3; --raise:#ffffff; --ink:#1b2a33; --muted:#5b6a72; --line:#d9d2c0;
  --land:#ecdcae; --land-edge:#8a7748; --water:#e9f2f3; --grat:#a9bcc2; --map-ink:#30505c;
  --accent:#a81f74; --accent-ink:#ffffff; --particle:20,52,74;
  --r-flat:#98a2a8; --r-poor:#c9553f; --r-pf:#df8b3a; --r-fair:#d9bb3a; --r-fg:#8dbf4c; --r-good:#2c9c6c; --r-epic:#7650d4;
  --night:rgba(40,56,70,.07); --glass:rgba(251,249,243,.86);
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-water:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a151b; --panel:#101e27; --raise:#162a35; --ink:#e4edef; --muted:#8ea2aa; --line:#24363f;
  --land:#2e2b1e; --land-edge:#9a8a55; --water:#0b1b25; --grat:#294450; --map-ink:#9db6bf;
  --accent:#ff74c0; --accent-ink:#2a0a1c; --particle:226,244,248;
  --night:rgba(0,0,0,.22); --glass:rgba(16,30,39,.84); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a151b; --panel:#101e27; --raise:#162a35; --ink:#e4edef; --muted:#8ea2aa; --line:#24363f;
  --land:#2e2b1e; --land-edge:#9a8a55; --water:#0b1b25; --grat:#294450; --map-ink:#9db6bf;
  --accent:#ff74c0; --accent-ink:#2a0a1c; --particle:226,244,248;
  --night:rgba(0,0,0,.22); --glass:rgba(16,30,39,.84); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--f-ui);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
.chart{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0}
.map{position:relative;overflow:hidden;background:var(--water);min-height:260px}
#mapgl{position:absolute;inset:0;font:inherit}
.map>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#marks{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.maphead,.legend,.zoom,.msg,.looks{z-index:4}
.looks{position:absolute;left:12px;top:54px}
.maplibregl-ctrl-attrib{font-size:10.5px}
.mk{position:absolute;left:0;top:0;padding:0;border:0;background:none;pointer-events:auto;display:flex;align-items:center;gap:6px;white-space:nowrap}
.mk i{display:block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--panel);margin:-5px 0 0 -5px;flex:none}
.mk span{display:none;margin-top:-10px;font:500 12.5px/1 var(--f-ui);background:var(--glass);color:var(--ink);padding:4px 7px;border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mk:hover span,.mk.sel span,.mk.lab span{display:block}
.mk.lab{z-index:2}
.mk:hover,.mk.sel{z-index:5}
.mk.sel i{width:16px;height:16px;margin:-8px 0 0 -8px;border-width:2px;box-shadow:0 0 0 1.5px var(--ink)}
.mk.buoy i{border-radius:1px;transform:rotate(45deg);background:var(--panel);border:1.5px solid var(--accent);width:7px;height:7px;margin:-3.5px 0 0 -3.5px}
.mk.buoy.stale i{border-color:var(--muted)}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:9px}
.maphead{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
.brand{padding:8px 12px;pointer-events:auto}
.brand h1{margin:0;font:600 15px/1 var(--f-ui);letter-spacing:.005em}
.seg{display:flex;padding:3px;gap:2px;pointer-events:auto}
.seg button{border:0;background:none;padding:6px 11px;font:500 13px/1 var(--f-ui);color:var(--muted);border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.zoom{position:absolute;right:12px;top:58px;display:flex;flex-direction:column;overflow:hidden}
.zoom button{border:0;background:none;width:32px;height:30px;font:500 17px/1 var(--f-ui);color:var(--muted)}
.zoom button:hover{color:var(--ink)}
.legend{position:absolute;left:12px;bottom:12px;padding:8px 10px;font:500 11.5px/1 var(--f-ui);color:var(--muted);max-width:calc(100% - 24px)}
.legend b{display:block;margin-bottom:6px;color:var(--ink);font-weight:500}
.legend .bar{height:6px;width:190px;max-width:100%;border-radius:3px}
.legend .tk{display:flex;justify-content:space-between;margin-top:4px}
.legend .probe{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .probe:not(:empty){margin-top:7px}
.time{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:10px 16px 11px;background:var(--panel);border-top:1px solid var(--line)}
.when{min-width:150px}
.when strong{display:block;font:600 15px/1.2 var(--f-ui)}
.when small{color:var(--muted);font-size:12px}
.tbtn{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:none;padding:6px 11px;font:500 13px/1 var(--f-ui);border-radius:7px;color:var(--ink)}
.btn:hover{background:var(--raise)}
.track{position:relative;min-width:0}
.track input{width:100%;margin:0;display:block;accent-color:var(--accent)}
.days{display:flex;font:500 11px/1 var(--f-ui);color:var(--muted);margin-top:4px}
.days i{font-style:normal}
.days span{flex:1;overflow:hidden;white-space:nowrap}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.tabs{display:flex;gap:18px;padding:0 18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:14px 0 11px;font:500 14px/1 var(--f-ui);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.body{overflow:auto;min-height:0;flex:1;padding:16px 18px 22px;display:flex;flex-direction:column;gap:18px}
.lab{font:500 12px/1.2 var(--f-ui);color:var(--muted);margin:0}
.outlook{display:flex;flex-direction:column;gap:6px}
.outlook p{margin:0}
.outlook svg,.fc svg{display:block;width:100%;height:auto}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chips button{border:0;background:none;padding:6px 10px;font:500 13px/1 var(--f-ui);color:var(--muted);border-radius:999px;white-space:nowrap;flex:none}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:3px 11px;align-items:baseline;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 0}
.rows>:first-child{border-top:0}
.row:hover .nm,.brow:hover .nm{text-decoration:underline;text-underline-offset:3px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.row .nm{font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{grid-column:2/4;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub b{font-weight:500;color:var(--ink)}
.row .ft{font-weight:600;font-size:15px;white-space:nowrap}
.rt{display:inline-block;padding:5px 10px;font:600 12.5px/1 var(--f-ui);border-radius:999px;color:#111}
.rt.dk{color:#fff}
.rl{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.det{display:flex;flex-direction:column;gap:18px}
.det h2{margin:0 0 2px;font:600 22px/1.15 var(--f-ui);letter-spacing:-.005em}
.det .back{border:0;background:none;padding:0;color:var(--muted);font:500 13px/1 var(--f-ui);align-self:flex-start}
.det .back:hover{color:var(--ink)}
.hcard{position:relative;border-radius:20px;padding:18px 18px 16px;background:linear-gradient(145deg,color-mix(in srgb,var(--rc) 34%,var(--panel)) 0%,color-mix(in srgb,var(--rc) 10%,var(--panel)) 55%,var(--raise) 100%);border:1px solid color-mix(in srgb,var(--rc) 32%,var(--line))}
.hcard h2{margin:0;padding-right:44px;font:600 21px/1.15 var(--f-ui)}
.hsub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.hstar{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 9%,transparent);font-size:18px;line-height:1;color:var(--muted)}
.hstar[aria-pressed="true"]{color:var(--r-fair)}
.hbig{display:flex;align-items:baseline;gap:9px;margin-top:18px}
.hbig b{font:700 52px/0.9 var(--f-ui);letter-spacing:-.02em}
.hbig span{font:600 20px/1 var(--f-ui);color:var(--muted)}
.hpill{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:var(--rc);color:#111;font:600 13px/1 var(--f-ui);padding:7px 12px;border-radius:999px}
.hpill.dk{color:#fff}
.hpill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.hline{margin:12px 0 0;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:-6px}
.tile{background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:12px 13px;min-width:0;display:flex;flex-direction:column}
.tile .tk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.tile b{font:600 18px/1.2 var(--f-ui);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hero .big{font:600 30px/1 var(--f-ui);letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:2px 0 0;font-weight:500}
.kv dd small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:400;font-size:12px;color:var(--muted);text-align:left;padding:0 6px 6px 0}
td{padding:7px 6px 7px 0;border-top:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;padding-right:0}
.arr{display:inline-block;width:11px;height:11px;vertical-align:-1px}
.wins{display:flex;flex-direction:column}
.win{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:8px 0;border:0;border-top:1px solid var(--line);font-size:13.5px;background:none;text-align:left}
.wins>:first-child{border-top:0}
.win .m{color:var(--muted)}
.note{margin:0;color:var(--muted);font-size:13px}
.dcards{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 2px}
.dcards::-webkit-scrollbar{display:none}
.dcard{flex:none;min-width:92px;display:flex;flex-direction:column;gap:0;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:16px;padding:11px 12px}
.dcard[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
.dcard .dn{font-size:12px;color:var(--muted)}
.dcard[aria-pressed="true"] .dn{color:color-mix(in srgb,var(--panel) 65%,var(--ink))}
.dcard .dh{font-weight:600;font-size:16px;white-space:nowrap;margin:3px 0 9px}
.dcard .dseg{display:flex;gap:3px;width:100%}
.dcard .dseg i{flex:1;height:5px;border-radius:3px}
.spec{display:grid;grid-template-columns:minmax(0,1fr) 138px;gap:12px;align-items:center}
.slist{display:flex;flex-direction:column;gap:9px;min-width:0}
.srow{display:grid;grid-template-columns:12px auto auto minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;font-size:13px;white-space:nowrap}
.srow small{grid-column:2/-1;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.srow .num{text-align:right}
.rose{display:block;width:100%;height:auto}
.hours{display:flex;flex-direction:column;margin-top:6px}
.hrow{display:grid;grid-template-columns:44px 70px minmax(0,1fr) 78px 30px;gap:8px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:6px 0;font-size:12.5px}
.hrow>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hs{display:flex;align-items:center;gap:6px;font-weight:600}
.hrow .dot{width:8px;height:8px}
.hrow small{display:block;color:var(--muted);font-size:11px}
.hrow .num{text-align:right}
.hrow.night{color:var(--muted)}
.hrow.on{background:var(--raise);border-radius:7px;padding-inline:8px;margin-inline:-8px;border-top-color:transparent}
.hrow.on+.hrow{border-top-color:transparent}
.hrow.w3{grid-template-columns:56px 60px minmax(0,1fr) 66px 60px;gap:6px}
.steprow{display:flex;justify-content:flex-end;margin-top:12px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.favb{flex:none;white-space:nowrap}
.favb[aria-pressed="true"]{background:var(--raise)}
.fv{color:var(--r-fair);font-size:12px}
.seg2{display:flex;padding:2px;gap:2px;border:1px solid var(--line);border-radius:8px}
.seg2 button{border:0;background:none;padding:5px 10px;font:500 12.5px/1 var(--f-ui);color:var(--muted);border-radius:6px}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.hhead{border-top:0;color:var(--muted);font-size:11.5px;padding-bottom:4px}
.fc{cursor:crosshair}
.foot{margin-top:auto;padding-top:14px;font-size:12px;color:var(--muted)}
.foot button{border:0;background:none;padding:0;margin-left:6px;color:var(--ink);text-decoration:underline;text-underline-offset:2px;font-size:12px}
.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 20px;max-width:min(400px,calc(100% - 32px));text-align:center}
.msg b{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
.msg button{margin-top:10px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:11px 0;align-items:baseline}
.brow .nm{font-weight:500;font-size:15px}
.brow .v{font-weight:600;font-size:15px;white-space:nowrap}
.brow .sub{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.brow svg{grid-column:1/-1;display:block;width:100%;height:22px;margin-top:5px}
@media (max-width:860px){
  html,body{height:auto}
  .app{display:block;height:auto}
  .map{height:54vh;min-height:320px}
  .panel{min-height:50vh;border-left:0}
  .body{overflow:visible;padding-inline:16px}
  .chips,.dcards{margin-inline:-16px;padding-inline:16px}
  .tabs{padding:0 16px}
  .time{grid-template-columns:minmax(0,1fr) auto;padding-inline:16px}
  .track{grid-column:1/-1;grid-row:2}
  .days i{display:none}
  .legend .bar{width:140px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
  <section class="chart" aria-label="Swell map">
    <div class="map" id="map">
      <div id="mapgl"></div><canvas id="cField"></canvas><canvas id="cPart"></canvas>
      <div id="marks"></div>
      <div class="maphead">
        <div class="brand glass"><h1>SoCal Swell Chart</h1></div>
        <div class="seg glass" role="group" aria-label="Map layer">
          <button id="lyr-swell" aria-pressed="true">Swell</button><button id="lyr-period" aria-pressed="false">Period</button><button id="lyr-wind" aria-pressed="false">Wind</button>
        </div>
      </div>
      <div class="seg glass looks" id="looks" role="group" aria-label="Map look"></div>
      <div class="legend glass" id="legend"></div>
      <div class="zoom glass"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit" aria-label="Show whole coast" title="Show whole coast">&#8962;</button></div>
      <div class="msg glass" id="msg"><b>Loading the forecast</b>Pulling swell, wind, tide and buoy data.</div>
    </div>
    <div class="time">
      <div class="when"><strong id="when">&nbsp;</strong><small id="whensub"></small></div>
      <div class="track"><input type="range" id="t" min="0" max="167" value="0" step="1" aria-label="Forecast hour"><div class="days" id="days"></div></div>
      <div class="tbtn"><button class="btn" id="play" aria-pressed="false">Play</button><button class="btn" id="now">Now</button></div>
    </div>
  </section>
  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-spots" aria-selected="true">Spots</button>
      <button role="tab" id="tab-buoys" aria-selected="false">Buoys</button>
      <button role="tab" id="tab-how" aria-selected="false">Method</button>
    </div>
    <div class="body" id="body"></div>
  </aside>
</div>
