<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swell</title>
<meta name="application-name" content="Swell">
<meta name="apple-mobile-web-app-title" content="Swell">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121314">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Serif+4:ital,wght@1,400&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
<style>

/* Layout: the chart fills the left with a few floating controls; a quiet list panel sits on the right (stacks under on phones). */
:root{
  --bg:#f1ecdf; --panel:#fbf9f3; --raise:#ffffff; --ink:#1b2a33; --muted:#5b6a72; --line:#d9d2c0;
  --land:#ecdcae; --land-edge:#8a7748; --water:#e9f2f3; --grat:#a9bcc2; --map-ink:#30505c;
  --accent:#0b8a91; --earn:#2f9e5b; --warn:#c2751f; --accent-ink:#ffffff; --particle:20,52,74;
  --r-flat:#98a2a8; --r-poor:#c9553f; --r-pf:#df8b3a; --r-fair:#d9bb3a; --r-fg:#8dbf4c; --r-good:#2c9c6c; --r-epic:#7650d4;
  --night:rgba(40,56,70,.07); --glass:rgba(251,249,243,.86);
  --f-ui:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Outfit",system-ui,sans-serif;
  --f-water:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121314; --panel:#1b1c1e; --raise:#252628; --ink:#ebecee; --muted:#9a9da3; --line:#303236;
  --land:#2c2b28; --land-edge:#8a7d55; --water:#0f1011; --grat:#35373b; --map-ink:#b0b4b9;
  --accent:#35c4c9; --earn:#4cc27e; --warn:#e8a05a; --accent-ink:#06191b; --particle:226,244,248;
  --night:rgba(0,0,0,.22); --glass:rgba(27,28,30,.88); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121314; --panel:#1b1c1e; --raise:#252628; --ink:#ebecee; --muted:#9a9da3; --line:#303236;
  --land:#2c2b28; --land-edge:#8a7d55; --water:#0f1011; --grat:#35373b; --map-ink:#b0b4b9;
  --accent:#35c4c9; --earn:#4cc27e; --warn:#e8a05a; --accent-ink:#06191b; --particle:226,244,248;
  --night:rgba(0,0,0,.22); --glass:rgba(27,28,30,.88); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--f-ui);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
.chart{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0}
.map{position:relative;overflow:hidden;background:var(--water);min-height:260px}
#mapgl{position:absolute;inset:0;font:inherit}
.map>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#marks{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.maphead,.legend,.zoom,.msg{z-index:4}
.lall{width:100%;margin-top:6px;border:0;background:color-mix(in srgb,var(--ink) 8%,transparent);padding:10px;border-radius:10px;font:500 13.5px/1 var(--f-ui);color:var(--ink)}
.maplibregl-ctrl-attrib{font-size:10.5px}
.mk{position:absolute;left:0;top:0;padding:0;border:0;background:none;pointer-events:auto;display:flex;align-items:center;gap:6px;white-space:nowrap}
.mk i{display:block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--panel);margin:-5px 0 0 -5px;flex:none}
.mk span{display:none;margin-top:-10px;font:500 12.5px/1 var(--f-ui);background:var(--glass);color:var(--ink);padding:4px 7px;border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mk:hover span,.mk.sel span,.mk.lab span{display:block}
.mk.lab{z-index:2}
.mk:hover,.mk.sel{z-index:5}
.mk.sel i{width:16px;height:16px;margin:-8px 0 0 -8px;border-width:2px;box-shadow:0 0 0 1.5px var(--ink)}
.mk.buoy i{border-radius:1px;transform:rotate(45deg);background:var(--panel);border:1.5px solid var(--accent);width:7px;height:7px;margin:-3.5px 0 0 -3.5px}
.mk.buoy.stale i{border-color:var(--muted)}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:9px}
.maphead{position:absolute;left:12px;top:calc(23px + env(safe-area-inset-top));right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
.brand{padding:8px 12px;pointer-events:auto}
.brand h1{margin:0;font:600 16px/1 var(--f-ui);letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand h1 img{border-radius:5px;display:block}
.seg{display:flex;padding:3px;gap:2px;pointer-events:auto}
.seg button{border:0;background:none;padding:6px 11px;font:500 13px/1 var(--f-ui);color:var(--muted);border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.zoom{position:absolute;right:12px;top:calc(69px + env(safe-area-inset-top));display:flex;flex-direction:column;overflow:hidden}
.zoom button{border:0;background:none;width:32px;height:30px;font:500 17px/1 var(--f-ui);color:var(--muted)}
.zoom button:hover{color:var(--ink)}
.legend{position:absolute;left:12px;bottom:12px;padding:8px 10px;font:500 11.5px/1 var(--f-ui);color:var(--muted);max-width:calc(100% - 24px)}
.legend b{display:block;margin-bottom:6px;color:var(--ink);font-weight:500}
.legend .bar{height:6px;width:190px;max-width:100%;border-radius:3px}
.legend .tk{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.legend .probe{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .probe:not(:empty){margin-top:7px}
.time{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:10px 16px 11px;background:var(--panel);border-top:1px solid var(--line)}
.when{min-width:150px}
.when strong{display:block;font:600 15px/1.2 var(--f-ui)}
.when small{color:var(--muted);font-size:12px}
.tbtn{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:none;padding:6px 11px;font:500 13px/1 var(--f-ui);border-radius:7px;color:var(--ink)}
.btn:hover{background:var(--raise)}
.track{position:relative;min-width:0}
.track input{width:100%;margin:0;display:block;height:18px;background:none;-webkit-appearance:none;appearance:none}
.track input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.track input::-moz-range-track{height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--ink);border:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.track input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.days{display:flex;font:500 11px/1 var(--f-ui);color:var(--muted);margin-top:4px}
.days i{font-style:normal}
.days span{flex:1;overflow:hidden;white-space:nowrap}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.tabs{display:flex;gap:18px;padding:0 18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:14px 0 11px;font:500 14px/1 var(--f-ui);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.body{overflow:auto;min-height:0;flex:1;padding:16px 18px 22px;display:flex;flex-direction:column;gap:18px}
.lab{font:500 12px/1.2 var(--f-ui);color:var(--muted);margin:0}
.outlook{display:flex;flex-direction:column;gap:6px}
.outlook p{margin:0}
.outlook svg,.fc svg{display:block;width:100%;height:auto}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.grab{display:none}
.peek{display:none}
.chips.three{margin:0;padding:0;gap:6px}
.chips.three button{flex:1;text-align:center;padding:9px 6px;background:var(--raise);border:1px solid var(--line)}
.chips.three button[aria-pressed="true"]{border-color:var(--ink)}
.chips button{border:0;background:none;padding:6px 10px;font:500 13px/1 var(--f-ui);color:var(--muted);border-radius:999px;white-space:nowrap;flex:none}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:3px 11px;align-items:baseline;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 0}
.rows>:first-child{border-top:0}
.row:hover .nm,.brow:hover .nm{text-decoration:underline;text-underline-offset:3px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.row .nm{font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{grid-column:2/4;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub b{font-weight:500;color:var(--ink)}
.row .ft{font-weight:600;font-size:15px;white-space:nowrap}
.rt{display:inline-block;padding:5px 10px;font:600 12.5px/1 var(--f-ui);border-radius:999px;color:#111}
.rt.dk{color:#fff}
.rl{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.det{display:flex;flex-direction:column;gap:18px}
.det h2{margin:0 0 2px;font:600 22px/1.15 var(--f-ui);letter-spacing:-.005em}
.det .back{border:0;background:none;padding:0;color:var(--muted);font:500 13px/1 var(--f-ui);align-self:flex-start}
.det .back:hover{color:var(--ink)}
.hcard{position:relative;border-radius:18px;padding:14px 16px 13px;background:linear-gradient(145deg,color-mix(in srgb,var(--rc) 34%,var(--panel)) 0%,color-mix(in srgb,var(--rc) 10%,var(--panel)) 55%,var(--raise) 100%);border:1px solid color-mix(in srgb,var(--rc) 32%,var(--line))}
.hcard h2{margin:0;padding-right:44px;font:600 19px/1.15 var(--f-ui)}
.hsub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.hstar{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 9%,transparent);font-size:18px;line-height:1;color:var(--muted)}
.hstar[aria-pressed="true"]{color:var(--r-fair)}
.hbig{display:flex;align-items:baseline;gap:8px;margin-top:11px}
.hbig b{font:700 42px/0.9 var(--f-ui);letter-spacing:-.02em}
.hbig span{font:600 17px/1 var(--f-ui);color:var(--muted)}
.hpill{display:inline-flex;align-items:center;gap:7px;margin-top:9px;background:var(--rc);color:#111;font:600 13px/1 var(--f-ui);padding:7px 12px;border-radius:999px}
.hpill.dk{color:#fff}
.hpill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.hline{margin:9px 0 0;font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:-6px}
.tile{background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:12px 13px;min-width:0;display:flex;flex-direction:column}
.tile .tk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.tile b{font:600 18px/1.2 var(--f-ui);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hero .big{font:600 30px/1 var(--f-ui);letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:2px 0 0;font-weight:500}
.kv dd small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:400;font-size:12px;color:var(--muted);text-align:left;padding:0 6px 6px 0}
td{padding:7px 6px 7px 0;border-top:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;padding-right:0}
.arr{display:inline-block;width:11px;height:11px;vertical-align:-1px}
.wins{display:flex;flex-direction:column}
.win{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:8px 0;border:0;border-top:1px solid var(--line);font-size:13.5px;background:none;text-align:left}
.wins>:first-child{border-top:0}
.win .m{color:var(--muted)}
.note{margin:0;color:var(--muted);font-size:13px}
.bw{display:flex;flex-direction:column;gap:8px}
.bwc{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:16px;padding:12px 14px 12px 0;overflow:hidden;width:100%;color:var(--ink)}
.bwc>i{background:var(--rc);border-radius:0 4px 4px 0;grid-row:1/4}
.bwc .t{font:600 15px/1.2 var(--f-ui)}
.bwc .t small{font:500 12px/1 var(--f-ui);color:var(--muted);margin-left:6px}
.bwc .f{font:600 18px/1 var(--f-ui);text-align:right}
.bwc .p{margin-top:7px}
.bwc .pill{display:inline-block;background:var(--rc);color:#111;font:600 12px/1 var(--f-ui);padding:5px 9px;border-radius:999px}
.bwc .pill.dk{color:#fff}
.bwc .c{grid-column:2/4;margin-top:7px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.bwc .z{color:var(--r-fg)}
.bwd{display:flex;flex-direction:column}
.bwr{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:13.5px;color:var(--ink)}
.bwd>:first-child{border-top:0}
.bwr b{font-weight:600;color:var(--muted)}
.bwr .r{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.bwr .dot{width:8px;height:8px;border-radius:50%}
.al{border:1px solid color-mix(in srgb,var(--r-pf) 55%,var(--line));background:color-mix(in srgb,var(--r-pf) 14%,var(--raise));border-radius:14px;color:var(--ink)}
.al summary{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:11px 13px;cursor:pointer}
.al summary::-webkit-details-marker{display:none}
.al summary svg{flex:none;margin-top:1px;color:var(--r-pf)}
.al b{display:block;font:600 14px/1.25 var(--f-ui)}
.al small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.al p{margin:0;padding:0 13px 12px 43px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.wx{border:1px solid var(--line);background:var(--raise);border-radius:16px;padding:14px}
.wx .big{font:600 26px/1 var(--f-ui)}
.wx .big small{font:500 13px/1 var(--f-ui);color:var(--muted);margin-left:8px}
.wx .sub{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:1em}
.wx .row{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-top:12px;text-align:center}
.wx .row button{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font-size:12px;color:var(--muted);padding:8px 0;border-radius:10px}
.wx .row button.on{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}
.wx .row b{font:600 15px/1 var(--f-ui);color:var(--ink)}
.wx .row em{font-style:normal;color:#6fb3e0;font-size:11.5px;min-height:13px}
.wx .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.wx .mini div{background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:12px;padding:9px 10px}
.wx .mini span{display:block;font-size:11.5px;color:var(--muted)}
.wx .mini b{font:600 15px/1.2 var(--f-ui);display:block;margin-top:3px}
.dcards{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 2px}
.dcards::-webkit-scrollbar{display:none}
.dcard{flex:none;min-width:92px;display:flex;flex-direction:column;gap:0;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:16px;padding:11px 12px}
.dcard[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
.dcard .dn{font-size:12px;color:var(--muted)}
.dcard[aria-pressed="true"] .dn{color:color-mix(in srgb,var(--panel) 65%,var(--ink))}
.dcard .dh{font-weight:600;font-size:16px;white-space:nowrap;margin:3px 0 9px}
.dcard .dseg{display:flex;gap:3px;width:100%}
.dcard .dseg i{flex:1;height:5px;border-radius:3px}
.spec{display:grid;grid-template-columns:minmax(0,1fr) 138px;gap:12px;align-items:center}
.slist{display:flex;flex-direction:column;gap:9px;min-width:0}
.srow{display:grid;grid-template-columns:12px auto auto minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;font-size:13px;white-space:nowrap}
.srow small{grid-column:2/-1;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.srow .num{text-align:right}
.rose{display:block;width:100%;height:auto}
.hours{display:flex;flex-direction:column;margin-top:6px}
.hrow{display:grid;grid-template-columns:44px 66px minmax(0,1fr) 72px 30px 38px;gap:6px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:6px 0;font-size:12.5px}
.hrow>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hs{display:flex;align-items:center;gap:6px;font-weight:600}
.hrow .dot{width:8px;height:8px}
.hrow small{display:block;color:var(--muted);font-size:11px}
.hrow .num{text-align:right}
.hrow .num:last-child{padding-right:1px}
.hrow.night{color:var(--muted)}
.hrow.on{background:var(--raise);border-radius:7px;padding-inline:8px;margin-inline:-8px;border-top-color:transparent}
.hrow.on+.hrow{border-top-color:transparent}
.hrow.w3{grid-template-columns:56px 52px minmax(0,1fr) 54px 50px 36px;gap:3px}
.steprow{display:flex;justify-content:flex-end;margin-top:12px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.favb{flex:none;white-space:nowrap}
.favb[aria-pressed="true"]{background:var(--raise)}
.fv{color:var(--r-fair);font-size:12px}
.why{background:transparent}
.wtop{display:flex;justify-content:space-between;align-items:baseline}
.wsc{font-size:30px;font-weight:600;line-height:1.1}.wsc small{font-size:14px;color:var(--muted);font-weight:400}
.wbg{color:var(--muted);font-size:13px}.wbg b{color:var(--warn);font-weight:500}
.wsub{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.wmeter{display:flex;gap:2px;height:16px;border-radius:8px;overflow:hidden;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ink) 9%,transparent) 0 5px,color-mix(in srgb,var(--ink) 4%,transparent) 5px 10px)}
.wmeter i{display:block;height:100%;background:var(--earn)}.wmeter i:nth-child(even){background:color-mix(in srgb,var(--earn) 70%,var(--panel))}
.wticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:4px 0 8px}

   <button class="tile" data-pop="wind"><span class="tk">${ICON.wind}Wind<i class="chev">›</i></span><b>${h.w.d==null?"n/a":`${Math.round(s.wx.ws[TI])} kn ${arrow(s.wx.wd[TI])} ${comp(s.wx.wd[TI])}`}</b><small>${h.w.d==null?"":`${h.w.word} · gusts ${Math.round(s.wx.wg[TI]||0)}`}</small></button>
   <button class="tile" data-pop="tide"${s.tide?"":" disabled"}><span class="tk">${ICON.tide}Tide<i class="chev">›</i></span><b>${tide==null?"n/a":`${tide.toFixed(1)} ft ${trend==="rising"?"↑":trend==="falling"?"↓":""}`}</b><small>${tide==null?"":`${trend[0].toUpperCase()+trend.slice(1)} · likes ${s.td}`}</small></button>
   <div class="tile"><span class="tk">${ICON.temp}Water</span><b>${sst==null?"n/a":`${Math.round(sst*9/5+32)}°F`}</b><small>Sea surface</small></div>
   <button class="tile" data-pop="wx"${s.wx&&s.wx.tp&&s.wx.tp[TI]!=null?"":" disabled"}><span class="tk">${ICON.sun}Weather<i class="chev">›</i></span><b>${s.wx&&s.wx.tp&&s.wx.tp[TI]!=null?Math.round(s.wx.tp[TI])+"°F":"n/a"}</b><small>${s.wx&&s.wx.tp&&s.wx.tp[TI]!=null?skyOf(s.wx,TI).t:""}</small></button>
  </div>
  ${alertBanner(s.r)}
  <div><p class="lab" style="margin-bottom:8px">By day</p>${dayCards(s)}</div>
  <div><p class="lab" style="margin-bottom:8px">Outlook · ${fmt(TI).split(" ")[0]}</p>${dayChart(s)}<div class="steprow"><div class="seg2" role="group" aria-label="Table interval"><button data-step="3" aria-pressed="${S.step===3}">3-hour</button><button data-step="1" aria-pressed="${S.step===1}">Hourly</button></div></div>${hourly(s)}</div>
  <div><p class="lab" style="margin-bottom:8px">Swell Breakdown · ${fmt(TI)}</p>${spectra(s)}</div>
  <div><p class="lab" style="margin-bottom:8px">7 Day Forecast</p>${fcChart(s)}</div>
  ${bestWindowsView(s)}
  ${whyScore(s)}
  <p class="note">${esc(s.note)} Faces ${comp(s.f)}. Accepts swell from ${s.w.map(([a,b])=>`${comp(a)} to ${comp(b)}`).join(" and ")}; ideal faces ${s.sz[0]}–${s.sz[1]} ft.</p></div>`}
const buoyAge=d=>(Date.now()/1000-d.t[d.t.length-1])/60;
function ageText(d){const m=Math.max(0,Math.round(buoyAge(d)));return m<90?`${m} min ago`:`${Math.round(m/60)} h ago`}
function buoyView(){return`<p class="note">Live buoys, north to south. Harvest and San Nicolas see new swell first.</p><div class="rows">${BUOYS.map((b,k)=>{const d=DATA.buoys[k];
  if(!d.ok)return`<button class="brow" data-buoy="${k}"><span class="nm">${esc(b.n)}</span><span class="v">Offline</span><span class="sub">No recent data</span></button>`;
  const n=d.hs.length-1,mx=Math.max(...d.hs,1),pts=d.hs.map((v,i)=>`${(i/n*368+2).toFixed(1)},${(24-v/mx*20).toFixed(1)}`).join(" ");
  return`<button class="brow" data-buoy="${k}"><span class="nm">${esc(b.n)}</span><span class="v">${d.hs[n].toFixed(1)} ft @ ${Math.round(d.tp[n])} s</span>
  <span class="sub">Peak direction ${arrow(d.dp[n])} ${comp(d.dp[n])} ${Math.round(d.dp[n])}° · ${d.sst==null?"":`water ${Math.round(d.sst)}°F · `}${ageText(d)}</span>
  <svg viewBox="0 0 372 26" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--muted)" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg></button>`}).join("")}</div>
  <p class="note" style="font-size:12px">Significant wave height, last 24 hours.</p>`}
function howView(){return`<div class="det"><h2>How spots are rated</h2>
  <p class="note" style="color:var(--ink)">Every hour, each spot is scored on four things. They multiply, so flat water never rates well.</p>
  <dl class="kv" style="grid-template-columns:1fr">
  <div><dt>Size</dt><dd><small>Breaking height from each swell's height and period. Short chop under 9 s is marked down, swell that land, islands, breakwaters or the shallow sea floor keep from reaching the spot is cut (found by tracing waves backward over real depth data and OpenStreetMap breakwaters, so it can only lower a swell), and a local gain adjusts for spots that focus or shelter swell.</small></dd></div>
  <div><dt>Wind</dt><dd><small>Under 4 kn is glassy. Offshore costs little, onshore costs a lot. Onshore also caps the rating: about 6 kn limits a spot to Fair, 10 kn to Poor to fair, 15 kn to Poor.</small></dd></div>
  <div><dt>Period</dt><dd><small>Longer is better, from 6 s (weak) to 14 s and up (full marks).</small></dd></div>
  <div><dt>Tide</dt><dd><small>A small penalty outside the tide the spot likes.</small></dd></div></dl>
  <div class="wins">${RT.map((r,c)=>`<div class="win" style="grid-template-columns:130px 1fr">${rlab(c)}<span class="m">${["Faces under 1 ft","Score below 2","2 to 4","4 to 6","6 to 7.5","7.5 to 9","Above 9"][c]}</span></div>`).join("")}</div>
  <p class="note">Model estimates, not cam reports. Sandbars, kelp and local shadowing are invisible to it. Spot windows and gains are starting values to tune.</p>
  <p class="note">Data: Open-Meteo, Scripps CDIP, NOAA CO-OPS, NWS. Map: OpenFreeMap, © OpenMapTiles, data from OpenStreetMap; terrain from Mapzen, USGS and NOAA; satellite imagery © Esri, Maxar, Earthstar Geographics.</p></div>`}
let lastRender=0;
function render(fromPlay){if(!DATA)return;const b=$("body"),keep=b.scrollTop;
  for(const t of ["spots","buoys","how"])$("tab-"+t).setAttribute("aria-selected",S.tab===t);
  b.innerHTML=S.tab==="buoys"?buoyView():S.tab==="how"?howView():S.sel!=null?detail(DATA.spots[S.sel]):listView();
  b.scrollTop=keep;lastRender=Date.now();peekRender();if(POP.k)popRender();
  const ch=b.querySelector(".chips"),on=ch&&ch.querySelector('[aria-pressed="true"]');if(on)ch.scrollLeft=Math.max(0,on.offsetLeft-ch.offsetLeft-(ch.clientWidth-on.offsetWidth)/2)}
$("body").addEventListener("toggle",e=>{const k=e.target&&e.target.dataset&&e.target.dataset.why;if(!k)return;if(e.target.open)WHY.add(k);else WHY.delete(k)},true);
$("body").addEventListener("click",e=>{const t=e.target.closest("[data-pop],[data-spot],[data-fav],[data-sort],[data-reg],[data-back],[data-time],[data-buoy],[data-step],#refresh,#fc,[data-chart]");if(!t||!DATA)return;
  if(t.dataset.pop){popOpen(t.dataset.pop)}
  else if(t.dataset.spot!=null){const k=+t.dataset.spot,s=DATA.spots[k];select(k);goTo(s.lo,s.la,11.5)}
  else if(t.dataset.step){S.step=+t.dataset.step;try{localStorage.setItem("swellchart.step",String(S.step))}catch(e){}render()}
  else if(t.dataset.reg){setRegion(t.dataset.reg)}
  else if(t.dataset.fav!=null){const n=DATA.spots[+t.dataset.fav].n;if(FAVS.has(n))FAVS.delete(n);else FAVS.add(n);saveFavs();render();placeMarks()}
  else if(t.dataset.back){select(null)}
  else if(t.dataset.time){setTime(+t.dataset.time)}
  else if(t.dataset.buoy){const b=BUOYS[+t.dataset.buoy];goTo(b.lo,b.la,9.5)}
  else if(t.id==="refresh"){load(true)}
  else if(t.dataset.chart){const r=t.querySelector("svg").getBoundingClientRect(),f=((e.clientX-r.left)/r.width-+t.dataset.x0)/(+t.dataset.x1-+t.dataset.x0);setTime(+t.dataset.i0+Math.floor(clamp(f,0,0.9999)*+t.dataset.n))}
  else if(t.id==="fc"){const r=t.querySelector("svg").getBoundingClientRect(),f=((e.clientX-r.left)/r.width-+t.dataset.x0)/(+t.dataset.x1-+t.dataset.x0);setTime(Math.floor(clamp(f,0,0.9999)*DATA.times.length))}});
/* Press and drag across the Outlook chart or the 7 day forecast to scrub through time. The listener sits on the
   panel body, which is never rebuilt, so the drag survives the re-render that each time change triggers. */
let DRAG=null;
function scrub(e){const t=$("body").querySelector(DRAG==="fc"?"#fc":"[data-chart]");if(!t)return;
  const r=t.querySelector("svg").getBoundingClientRect(),f=clamp(((e.clientX-r.left)/r.width-+t.dataset.x0)/(+t.dataset.x1-+t.dataset.x0),0,0.9999);
  const i=DRAG==="fc"?Math.floor(f*DATA.times.length):+t.dataset.i0+Math.floor(f*+t.dataset.n);if(i!==TI)setTime(i)}
$("body").addEventListener("pointerdown",e=>{if(!DATA||e.button>0)return;const t=e.target.closest("[data-chart],#fc");if(!t)return;
  DRAG=t.id==="fc"?"fc":"chart";try{$("body").setPointerCapture(e.pointerId)}catch(_){}scrub(e)});
$("body").addEventListener("pointermove",e=>{if(DRAG&&DATA)scrub(e)});
for(const n of["pointerup","pointercancel"])$("body").addEventListener(n,()=>{DRAG=null});
syncTheme();legend();placeSheet();if(initMap()){if(!REDUCED)tick();load(false)}
</script>
</body></html>
